# =============================================================================
#  Chrono-DNS — full stack: PostgreSQL + inline gateway + web dashboard
#
#      docker compose up -d --build
#      dig @127.0.0.1 -p 5353 github.com
#      open http://127.0.0.1:8088
#
#  Everything here is free and runs locally. No cloud account required.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: chrono-postgres
    environment:
      POSTGRES_USER: chronodns
      POSTGRES_PASSWORD: chronodns
      POSTGRES_DB: chronodns
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronodns -d chronodns"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # One-shot: apply migrations and train the first model, then exit.
  bootstrap:
    build: .
    container_name: chrono-bootstrap
    depends_on:
      postgres:
        condition: service_healthy
    environment: &chrono_env
      CHRONODNS_DB_BACKEND: postgres
      CHRONODNS_PG_HOST: postgres
      CHRONODNS_PG_PORT: "5432"
      CHRONODNS_PG_USER: chronodns
      CHRONODNS_PG_PASSWORD: chronodns
      CHRONODNS_PG_DATABASE: chronodns
      CHRONODNS_LOG_LEVEL: INFO
    volumes:
      - models:/app/models
      - appdata:/app/data
    command: >
      sh -c "python -m chronodns init --reset &&
             python -m chronodns train --harden &&
             echo 'bootstrap complete'"
    restart: "no"

  gateway:
    build: .
    container_name: chrono-gateway
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *chrono_env
      CHRONODNS_LISTEN_HOST: 0.0.0.0
      CHRONODNS_LISTEN_PORT: "5353"
      CHRONODNS_ENFORCE: "true"
    volumes:
      - models:/app/models
      - appdata:/app/data
    ports:
      - "127.0.0.1:5353:5353/udp"
      - "127.0.0.1:5353:5353/tcp"
    command: ["serve", "--verbose"]
    restart: unless-stopped

  dashboard:
    build: .
    container_name: chrono-dashboard
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *chrono_env
      CHRONODNS_API_HOST: 0.0.0.0
      CHRONODNS_API_PORT: "8088"
    volumes:
      - models:/app/models
      - appdata:/app/data
    ports:
      - "127.0.0.1:8088:8088"
    command: ["dashboard"]
    restart: unless-stopped

volumes:
  pgdata:
  models:
  appdata:
