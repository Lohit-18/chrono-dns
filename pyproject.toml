[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronodns"
version = "1.0.0"
description = "ML-driven DNS security gateway and threat intelligence engine — detects DNS tunnelling, DGA and C2 beaconing inline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "i5 Designs" }]
keywords = [
    "dns", "security", "machine-learning", "threat-intelligence",
    "dns-tunneling", "dga", "c2-detection", "blue-team", "soc", "sql",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: SQL",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "rich>=13.0",
    "aiosqlite>=0.19",
    "dnslib>=0.9.23",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.0"]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]
all = [
    "asyncpg>=0.29",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/i5designs/chrono-dns"
Documentation = "https://github.com/i5designs/chrono-dns#readme"
Issues = "https://github.com/i5designs/chrono-dns/issues"

[project.scripts]
chronodns = "chronodns.cli:main"

[tool.setuptools]
packages = [
    "chronodns",
    "chronodns.features",
    "chronodns.ml",
    "chronodns.storage",
    "chronodns.engine",
    "chronodns.gateway",
    "chronodns.datagen",
    "chronodns.api",
    "chronodns.ui",
]

[tool.setuptools.package-data]
"chronodns.ui" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "slow: tests that train a model or replay a full capture",
    "postgres: tests that need a live PostgreSQL instance",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# SIM905: the hostname token list is deliberately written as a wrapped
# string literal — a 164-element list literal would be unreadable.
ignore = ["E501", "B008", "SIM108", "SIM905"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
